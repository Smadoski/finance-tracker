{% extends 'base.html' %}{% block content %}<h1>Accounts & assets</h1><div class="grid2"><section class="card"><h2>Add account</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Name<input name="name" required></label><label>Institution<input name="institution"></label><label>Type<select name="account_type"><option value="current">Current account</option><option value="savings">Savings</option><option value="premium_bonds">Premium Bonds</option><option value="cash">Cash</option><option value="pension">Pension pot</option><option value="other_asset">Other asset</option><option value="liability">Liability</option></select></label><label>Currency<select name="currency"><option>GBP</option><option>EUR</option></select></label><label>Opening balance / initial value<input name="opening_balance" type="number" step="0.01" value="0"></label><label>Notes<textarea name="notes"></textarea></label><button>Add account</button></form></section><section class="card"><h2>Accounts</h2><table><tr><th>Name</th><th>Type</th><th>{{base}} value</th></tr>{% for a in accounts %}<tr><td><a href="{{url_for('account_detail',account_id=a.id)}}">{{a.name}}</a></td><td>{{a.account_type.replace('_',' ')}}</td><td class="num">{{'{:,.2f}'.format(a.base_value)}}</td></tr>{% endfor %}</table></section></div>{% endblock %}
