{% extends 'base.html' %}{% block content %}
<div class="title-row"><h1>Edit Category Target</h1><a class="button secondary" href="{{url_for('budgets.index')}}">Cancel</a></div>
<section class="card form-card"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Category or subcategory<select name="category_id" required>{% for c in categories %}<option value="{{c.id}}" {{'selected' if target.category_id==c.id}}>{{c.label}}</option>{% endfor %}</select></label>
<label>Target amount<input type="number" min="0" step="0.01" name="target_amount" value="{{target.target_amount}}" required></label>
<div class="selector-grid"><label>Currency<select name="currency"><option {{'selected' if target.currency=='GBP'}}>GBP</option><option {{'selected' if target.currency=='EUR'}}>EUR</option></select></label><label>Period<select name="period">{% for value in ['weekly','monthly','quarterly','yearly'] %}<option value="{{value}}" {{'selected' if target.period==value}}>{{value|title}}</option>{% endfor %}</select></label></div>
<label class="check"><input type="checkbox" name="active" value="1" {{'checked' if target.active}}> Active</label><div class="form-actions"><button>Save changes</button><a class="button secondary" href="{{url_for('budgets.index')}}">Cancel</a></div></form></section>
{% endblock %}
