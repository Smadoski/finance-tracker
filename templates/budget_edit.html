{% extends 'base.html' %}{% block content %}<div class="title-row"><h1>Edit Category Target</h1><a class="button secondary" href="{{url_for('budgets.index')}}">Cancel</a></div><section class="card"><p><strong>{{category.parent_name+' / ' if category.parent_name else ''}}{{category.name}}</strong></p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Target amount<input type="number" min="0" step="0.01" name="target_amount" value="{{target.target_amount}}" required></label><label>Currency<select name="currency"><option {{'selected' if target.currency=='GBP'}}>GBP</option><option {{'selected' if target.currency=='EUR'}}>EUR</option></select></label><label>Period<select name="period">{% for value in ['weekly','monthly','quarterly','yearly'] %}<option value="{{value}}" {{'selected' if target.period==value}}>{{value|title}}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="active" value="1" {{'checked' if target.active}}> Active</label><button>Save changes</button></form></section>{% endblock %}
