{% extends 'base.html' %}{% block content %}
<div class="narrow"><h1>Transfers</h1><details class="disclosure" open><summary>Record transfer</summary><div class="disclosure-body">
<p class="muted">For currency exchange, enter the actual amount that left one account and arrived in the other.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Date<input type="date" name="tx_date" value="{{today}}" required></label><label>From<select name="from_account">{% for a in accounts %}<option value="{{a.id}}">{{a.name}} ({{a.currency}})</option>{% endfor %}</select></label><label>Amount sent<input type="number" step="0.01" min="0" name="from_amount" required></label><label>To<select name="to_account">{% for a in accounts %}<option value="{{a.id}}">{{a.name}} ({{a.currency}})</option>{% endfor %}</select></label><label>Amount received<input type="number" step="0.01" min="0" name="to_amount" required></label><label>Description<input name="description" value="Transfer"></label><button>Record transfer</button>
</form></div></details></div>{% endblock %}
