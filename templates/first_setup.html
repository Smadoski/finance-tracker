{% extends 'base.html' %}{% block content %}<h1>First-time Security Setup</h1><section class="card"><p>No previous Finance Tracker configuration was detected.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><h3>Tailscale / Tailnet</h3><p><strong>Status:</strong> {{tailscale.detail}}{% if tailscale.url %}<br><strong>Detected address:</strong> {{tailscale.url}}{% endif %}</p><label class="check"><input type="checkbox" name="tailnet_only" value="1" checked> Tailnet Only Access</label><h3>Finance Tracker credentials</h3><label class="check"><input type="checkbox" name="auth_required" value="1"> Require username and password</label><label>Administrator name<input name="name"></label><label>Username<input name="username"></label><label>Password<input type="password" name="password"></label><label class="check"><input type="checkbox" name="confirm_unprotected" value="1"> I understand the risk if both security options are disabled.</label><button>Save security configuration</button></form></section>{% endblock %}
