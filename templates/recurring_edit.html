{% extends 'base.html' %}{% block content %}<div class="title-row"><h1>Edit Recurring Transaction</h1><a class="button secondary" href="{{url_for('recurring.index')}}">Cancel</a></div><section class="card"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Description<input name="description" value="{{rule.description}}" required></label><label>Type<select name="transaction_type">{% for value in ['expense','income','transfer'] %}<option value="{{value}}" {{'selected' if rule.transaction_type==value}}>{{value|title}}</option>{% endfor %}</select></label><label>Account<select name="account_id">{% for a in accounts %}<option value="{{a.id}}" {{'selected' if rule.account_id==a.id}}>{{a.name}} ({{a.currency}})</option>{% endfor %}</select></label><label>Transfer destination<select name="to_account_id"><option value="">— not a transfer —</option>{% for a in accounts %}<option value="{{a.id}}" {{'selected' if rule.to_account_id==a.id}}>{{a.name}} ({{a.currency}})</option>{% endfor %}</select></label><label>Amount<input type="number" step="0.01" min="0.01" name="amount" value="{{rule.amount}}" required></label><label>Transfer received amount<input type="number" step="0.01" min="0.01" name="to_amount" value="{{rule.to_amount or ''}}"></label><label>Category<select name="category_id"><option value="">— none / transfer —</option>{% for c in categories %}<option value="{{c.id}}" {{'selected' if rule.category_id==c.id}}>{{c.kind}} · {{c.label}}</option>{% endfor %}</select></label><label>Start date<input type="date" name="start_date" value="{{rule.start_date}}"></label><label>Optional end date<input type="date" name="end_date" value="{{rule.end_date or ''}}"></label><label>Next scheduled date<input type="date" name="next_scheduled_date" value="{{rule.next_scheduled_date}}"></label><label>Frequency<select name="frequency">{% for value in ['daily','weekly','monthly','quarterly','annually'] %}<option value="{{value}}" {{'selected' if rule.frequency==value}}>{{value|title}}</option>{% endfor %}</select></label><label>Working-day adjustment<select name="working_day_adjustment">{% for value,label in [('exact','Exact scheduled date'),('previous','Previous working day'),('next','Next working day')] %}<option value="{{value}}" {{'selected' if rule.working_day_adjustment==value}}>{{label}}</option>{% endfor %}</select></label><label>Posting mode<select name="posting_mode"><option value="automatic" {{'selected' if rule.posting_mode=='automatic'}}>Post automatically</option><option value="pending" {{'selected' if rule.posting_mode=='pending'}}>Create as Pending for review</option></select></label><label class="check"><input type="checkbox" name="active" value="1" {{'checked' if rule.active}}> Active</label><button>Save changes</button></form></section>{% endblock %}
