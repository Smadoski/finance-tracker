{% extends 'base.html' %}{% block content %}<h1>User Credentials</h1><div class="grid2"><section class="card"><h2>Add user</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="add"><label>Name<input name="name" required></label><label>Username<input name="username" required></label><label>Password<input type="password" name="password" minlength="10" required></label><label>Role<select name="role"><option value="admin">Administrator</option><option value="member">Standard User</option><option value="readonly">Read Only</option></select></label><button>Add user</button></form></section><section class="card"><h2>Existing users</h2>{% for u in users %}<details class="user-card"><summary><strong>{{u.name}}</strong> — {{u.username}} — {{u.role}} — {{'Active' if u.active else 'Disabled'}}</summary><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="update"><input type="hidden" name="user_id" value="{{u.id}}"><label>Name<input name="name" value="{{u.name}}"></label><label>Username<input name="username" value="{{u.username}}"></label><label>Role<select name="role"><option value="admin" {{'selected' if u.role=='admin'}}>Administrator</option><option value="member" {{'selected' if u.role=='member'}}>Standard User</option><option value="readonly" {{'selected' if u.role=='readonly'}}>Read Only</option></select></label><label class="check"><input type="checkbox" name="active" value="1" {{'checked' if u.active}}> Active</label><button>Save user</button></form><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="reset_password"><input type="hidden" name="user_id" value="{{u.id}}"><label>New password<input type="password" name="password" minlength="10" required></label><button class="secondary">Reset password</button></form><form method="post" onsubmit="return confirm('Delete this user? Users with audit history will be disabled instead.')"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="delete"><input type="hidden" name="user_id" value="{{u.id}}"><button class="danger">Delete user</button></form></details>{% endfor %}</section></div>{% endblock %}
