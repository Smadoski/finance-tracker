{% extends 'base.html' %}{% block content %}<h1>Edit Transaction</h1><section class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Date<input type="date" name="tx_date" value="{{t.tx_date}}" required></label><label>Description<input name="description" value="{{t.description}}" required></label><label>Amount<input type="number" step="0.01" name="amount" value="{{'{:.2f}'.format(t.amount|abs)}}" required></label><label>Category<select name="category_id"><option value="">— uncategorised —</option>{% for c in categories %}<option value="{{c.id}}" {{'selected' if t.category_id==c.id}}>{{c.label}}</option>{% endfor %}</select></label><label>Tags<input name="tags" value="{{t.tag_text or ''}}"></label><label>Notes<textarea name="notes">{{t.notes or ''}}</textarea></label>{% if t.receipt_path %}<p>Current receipt: <a href="{{url_for('receipt_file',filename=t.receipt_path)}}" target="_blank">View</a></p><label class="check"><input type="checkbox" name="remove_receipt" value="1"> Remove existing receipt</label>{% endif %}<label>Replace/add receipt<input type="file" name="receipt" accept="image/jpeg,image/png,image/heic,image/heif,image/tiff"></label><button>Save transaction</button><a class="button secondary" href="{{url_for('transactions')}}">Cancel</a></form></section>{% endblock %}
