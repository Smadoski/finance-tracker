{% extends 'base.html' %}{% block content %}
<div class="title-row"><h1>Edit account</h1><a class="button secondary" href="{{url_for('account_detail',account_id=a.id)}}">Cancel</a></div>
<section class="card narrow-form"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Name<input name="name" value="{{a.name}}" required></label>
<label>Institution<input name="institution" value="{{a.institution or ''}}"></label>
<label>Type<select name="account_type"><option value="current" {{'selected' if a.account_type=='current'}}>Current account</option><option value="savings" {{'selected' if a.account_type=='savings'}}>Savings</option><option value="premium_bonds" {{'selected' if a.account_type=='premium_bonds'}}>Premium Bonds</option><option value="cash" {{'selected' if a.account_type=='cash'}}>Cash</option><option value="pension" {{'selected' if a.account_type=='pension'}}>Pension pot</option><option value="other_asset" {{'selected' if a.account_type=='other_asset'}}>Other asset</option><option value="liability" {{'selected' if a.account_type=='liability'}}>Liability</option></select></label>
<label>Currency<select name="currency"><option value="GBP" {{'selected' if a.currency=='GBP'}}>GBP</option><option value="EUR" {{'selected' if a.currency=='EUR'}}>EUR</option></select></label>
<label>Opening balance / initial value<input name="opening_balance" type="number" step="0.01" value="{{a.opening_balance}}"></label>
<label>Account status<select name="active"><option value="1" {{'selected' if a.active}}>Active</option><option value="0" {{'selected' if not a.active}}>Archived</option></select></label>
<label>Notes<textarea name="notes">{{a.notes or ''}}</textarea></label><button>Save changes</button></form></section>
{% endblock %}
