{% macro pdf_actions(url,title) %}<details class="pdf-actions"><summary>Statement: View / Download / Print / Share</summary><div class="actions"><a class="button secondary" href="{{url}}?share=1">View PDF</a><a class="button secondary" href="{{url}}">Download / Save PDF</a><button type="button" class="secondary" data-pdf-url="{{url}}" onclick="printPdf(this.dataset.pdfUrl)">Print PDF</button><button type="button" class="secondary" data-pdf-url="{{url}}" data-title="{{title}}" onclick="sharePdf(this.dataset.pdfUrl,this.dataset.title)">Share / Export</button></div><p class="muted">Print opens the native PDF viewer. Use its Print control or Cmd+P on Mac. On iPhone/iPad, use Share → Print or Save to Files.</p></details>{% endmacro %}
